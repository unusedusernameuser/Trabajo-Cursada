<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Tareas · Usuarios</title>
    <link rel="stylesheet" href="/css/styles.css">
    <script src="/js/common.js" defer></script>
    <script src="/js/app.js" defer></script>
</head>
<body>
    <div class="page">
        <header class="page-header">
            <h1>Gestor de Tareas</h1>
            <p>Creá y administrá los usuarios que van a organizar sus tareas, carpetas y tags. Desde la lista, cada usuario tiene su propia página de tareas.</p>
        </header>

        <main class="layout">
            <section class="panel" aria-labelledby="form-title">
                <h2 id="form-title">Nuevo usuario</h2>

                <form id="user-form">
                    <div class="field">
                        <label for="handle">Nombre de usuario</label>
                        <input id="handle" name="handle" type="text" maxlength="31" autocomplete="off" required>
                    </div>

                    <div class="field">
                        <label for="display_name">Nombre para mostrar</label>
                        <input id="display_name" name="display_name" type="text" maxlength="63" autocomplete="off" required>
                    </div>

                    <div class="field">
                        <label for="email">Email</label>
                        <input id="email" name="email" type="email" maxlength="255" autocomplete="off" required>
                    </div>

                    <div class="field">
                        <label for="password">Contraseña</label>
                        <input id="password" name="password" type="password" maxlength="255" autocomplete="new-password" required>
                    </div>

                    <button id="submit-btn" class="btn btn-primary" type="submit">Crear usuario</button>
                </form>

                <p id="message" class="message" role="status" aria-live="polite" hidden></p>
            </section>

            <section class="panel" aria-labelledby="list-title">
                <div class="list-header">
                    <h2 id="list-title">Usuarios</h2>
                    <span id="user-count" class="count">0</span>
                </div>

                <ul id="user-list" class="user-list"></ul>
                <p id="empty-state" class="empty" hidden>Todavía no hay usuarios. Creá el primero con el formulario.</p>
            </section>
        </main>
    </div>
</body>
</html>
